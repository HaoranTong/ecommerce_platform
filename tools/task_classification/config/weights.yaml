# 权重配置文件
# 定义各维度权重和评分参数

# 全局权重配置
global_weights:
  primary_type_threshold: 70    # 主类型最低置信度阈值
  secondary_type_threshold: 60  # 辅助类型最低置信度阈值
  high_confidence_threshold: 80 # 高置信度阈值（自动执行）
  low_confidence_threshold: 70  # 低置信度阈值（需用户确认）

# 关键词匹配权重
keyword_weights:
  exact_match: 1.0      # 精确匹配权重
  partial_match: 0.7    # 部分匹配权重
  regex_match: 0.8      # 正则匹配权重
  stemmed_match: 0.6    # 词干匹配权重

# 任务类型基础权重
task_type_base_weights:
  DESIGN: 1.0
  DEVELOP: 1.2    # 开发类任务权重略高
  TEST: 1.0
  INTEGRATE: 0.9
  MAINTAIN: 0.8
  SECURE: 1.1     # 安全类任务权重略高

# 检查点匹配权重
checkpoint_weights:
  required_bonus: 10    # 必选检查点额外加分
  conditional_bonus: 5  # 条件检查点额外加分
  priority_multiplier:
    high: 1.5
    medium: 1.0
    low: 0.7

# 上下文分析权重
context_weights:
  project_history: 0.1   # 项目历史权重
  recent_activities: 0.2 # 最近活动权重
  user_preferences: 0.1  # 用户偏好权重

# 调试和优化参数
debug_config:
  enable_detailed_logging: true
  score_breakdown: true
  keyword_analysis: true
  checkpoint_reasoning: true

# 性能优化参数
performance_config:
  max_keywords_per_category: 50
  cache_classification_results: true
  cache_ttl_minutes: 30