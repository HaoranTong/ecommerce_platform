services:
  # 开发环境MySQL
  mysql:
    image: mysql:8.0
    container_name: ecommerce_platform-mysql-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecommerce_platform
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ecommerce_network

  # 测试环境MySQL  
  mysql-test:
    image: mysql:8.0
    container_name: ecommerce_platform-mysql-test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: ecommerce_platform_test
    ports:
      - "3308:3306"
    volumes:
      - test_db_data:/var/lib/mysql
    networks:
      - ecommerce_network

  # Redis缓存服务
  redis:
    image: redis:7
    container_name: ecommerce_platform-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ecommerce_network

volumes:
  db_data:       # 开发数据持久化
  test_db_data:  # 测试数据持久化

networks:
  ecommerce_network:
    driver: bridge
    name: ecommerce_platform_network
